name: Keep Supabase awake

# Supabase pauses a free project after 7 days without activity, and the site then can't load anything.
# A small read twice a week counts as activity. If the read fails, the run fails and GitHub emails us.
# GitHub turns scheduled workflows off after 60 days without commits; re-enable it under Actions if that happens.
on:
  schedule:
    - cron: "17 6 * * 1,4" # Monday and Thursday, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row through the public API
        env:
          # The same public repository variables the site is built with (see pages.yml).
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          curl --silent --show-error --fail-with-body --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=github_username&limit=1"
