<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Signing in to the Arena</title>
  </head>
  <body style="font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 90vh; margin: 0 16px">
    <!-- The Arena's Anna app signs in with GitHub in a popup. Anna won't serve the app's own files to a popup, so
         the popup returns to this page on the website, which hands the one-time code back to the app window. -->
    <main style="max-width: 420px; text-align: center">
      <h1 style="font-size: 20px">AI Engineering Arena</h1>
      <p id="status">Finishing sign-in…</p>
      <button id="finish" type="button" hidden style="font: inherit; font-weight: 700; padding: 10px 20px; border-radius: 10px; border: 2px solid #1f5bd8; background: #1f5bd8; color: #fff; cursor: pointer">Finish signing in to the Arena</button>
    </main>
    <script type="module" src="/src/anna-callback.ts"></script>
  </body>
</html>
